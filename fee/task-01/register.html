<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="assets/css/register-page.css">
</head>

<body>
    <main class="flex">
        <section class="section-register">
            <h1>Register</h1>
            <form action="" method="post">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="first-name" class="form-control-label">First Name</label>
                        <input type="text" id="first-name" name="firstName" placeholder="Enter your first name"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="last-name" class="form-control-label">Last Name</label>
                        <input type="text" id="last-name" name="lastName" placeholder="Enter your last name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="flex-row">
                    <div class="form-group">
                        <label for="username" class="form-control-label">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="phone-number" class="form-control-label">Phone Number</label>
                        <input type="text" id="phone-number" name="phoneNumber" placeholder="Enter your phone number"
                            required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-control-label">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="form-control-label">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirmPassword"
                        placeholder="Confirm your password" required>
                </div>
                <div class="form-group flex-row">
                    <button>Back to home</button>
                    <button type="submit">Register</button>
                </div>
            </form>
            <a href="">Already have an account? Login</a>
        </section>
    </main>
</body>

</html>
